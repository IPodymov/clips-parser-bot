name: clips-parser

x-app: &app
  build: .
  image: clips-parser:latest
  env_file: .env
  environment:
    # Inside the compose network services are reached by name
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@postgres:5432/${POSTGRES_DB:-bot}
    REDIS_URL: redis://redis:6379/0
    BOT_API_URL: http://telegram-bot-api:8081
    # Same path in worker and telegram-bot-api: the server reads files by file:// URI
    DOWNLOAD_DIR: /downloads
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    telegram-bot-api:
      condition: service_healthy

services:
  bot:
    <<: *app
    command: sh -c "alembic upgrade head && python -m src.bot.main"

  worker:
    <<: *app
    command: >
      taskiq worker src.worker.broker:broker src.worker.tasks
      --workers 1 --max-async-tasks 3
    volumes:
      - downloads:/downloads

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - downloads:/downloads
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    ports:
      # Exposed for alembic/psql from the host; 5433 avoids clashing with a local Postgres
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Exposed for local runs of bot/worker from the host
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  downloads:
  telegram-bot-api-data:
  postgres-data:
  redis-data:
